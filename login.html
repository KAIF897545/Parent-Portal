<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in</title>
<meta name="description" content="Sign in to your Maldives Chess Club school portal." />
<meta name="theme-color" content="#F6F2E9" />
<link rel="icon" href="assets/mcc-badge.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MCC Portal" />
<script src="js/pwa-register.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/site.css" />
</head>
<body class="portal-landing">
<div class="page">
  <header class="brand">
    <div class="brand__logo"><img src="assets/mcc-logo.svg" alt="Maldives Chess Club" /></div>
    <h1 class="brand__name">Sign in</h1>
    <p class="brand__sub" id="schoolBanner"></p>
  </header>

  <main class="card">
    <div role="tablist" class="tabs" aria-label="Sign in as">
      <button
        type="button"
        role="tab"
        id="tab-student"
        aria-controls="panel-student"
        aria-selected="true"
        class="tab"
      >
        Student
      </button>
      <button
        type="button"
        role="tab"
        id="tab-coach"
        aria-controls="panel-coach"
        aria-selected="false"
        tabindex="-1"
        class="tab"
      >
        Coach
      </button>
    </div>

    <section
      id="panel-student"
      role="tabpanel"
      aria-labelledby="tab-student"
      class="tabpanel"
    >
      <form id="studentForm" novalidate>
        <div class="field">
          <label for="studentEmail">Email</label>
          <input
            type="email"
            id="studentEmail"
            name="email"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="studentPassword">Password</label>
          <input
            type="password"
            id="studentPassword"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <p class="forgot-row">
          <button type="button" class="text-btn" id="studentForgotToggle">Forgot password?</button>
        </p>
        <div class="field" id="studentForgotPanel" hidden>
          <p class="field__hint">We'll send a reset link to the email above.</p>
          <button type="button" class="btn btn--secondary" id="studentForgotSubmit">Send reset link</button>
          <div
            id="studentForgotMessage"
            class="form-message"
            role="status"
            aria-live="polite"
          ></div>
        </div>
        <div
          id="studentMessage"
          class="form-message"
          role="status"
          aria-live="polite"
        ></div>
        <button type="submit" class="btn btn--primary" id="studentSubmit">Sign in</button>
      </form>
    </section>

    <section
      id="panel-coach"
      role="tabpanel"
      aria-labelledby="tab-coach"
      class="tabpanel"
      hidden
    >
      <form id="coachForm" novalidate>
        <div class="field">
          <label for="coachEmail">Email</label>
          <input
            type="email"
            id="coachEmail"
            name="email"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="coachPassword">Password</label>
          <input
            type="password"
            id="coachPassword"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div
          id="coachMessage"
          class="form-message"
          role="status"
          aria-live="polite"
        ></div>
        <button type="submit" class="btn btn--primary" id="coachSubmit">Sign in</button>
      </form>
    </section>
  </main>

  <p style="text-align: center; margin-top: 20px;">
    <a href="portals.html">Choose a different portal</a>
  </p>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
