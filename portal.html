<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My progress</title>
<meta name="description" content="View your chess progress, checkpoints, and coach feedback." />
<meta name="theme-color" content="#b00f2e" />
<link rel="icon" href="assets/mcc-logo.jpg" type="image/jpeg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MCC Portal" />
<script src="js/pwa-register.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="css/site.css" />
</head>
<body class="portal-landing">
<div class="page page--wide">
  <header class="appbar">
    <div class="appbar__brand">
      <div class="appbar__logo"><img src="assets/mcc-logo.jpg" alt="" /></div>
      <div class="avatar-circle" id="studentAvatar" aria-hidden="true"></div>
      <div class="appbar__names">
        <h1 id="studentName">Loading…</h1>
        <p class="appbar__meta" id="studentMeta"></p>
      </div>
    </div>
    <div class="appbar__actions">
      <button type="button" class="btn btn--secondary" id="signOutButton">Sign out</button>
    </div>
  </header>

  <div id="status" class="form-message" role="status" aria-live="polite"></div>

  <section class="ring-card" id="ringCard" hidden></section>

  <h2 class="section-title">Checkpoints<span class="section-title__sub" id="badgeSummary"></span></h2>
  <div class="badges" id="badgeRow"></div>

  <div class="next-up" id="nextUp"></div>

  <h2 class="section-title">From your coach<span class="section-title__sub" id="feedbackSummary"></span></h2>
  <div id="feedbackCal"></div>
  <div id="feedbackList"></div>

  <h2 class="section-title">Where you are<span class="section-title__sub" id="unitSummary"></span></h2>
  <div class="unit-list" id="unitList"></div>
</div>

<script type="module" src="js/portal.js"></script>
</body>
</html>
